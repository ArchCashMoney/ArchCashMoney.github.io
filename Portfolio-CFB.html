<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>

<header>🏈 Biased Football Simulator</header>

<div class="container">
  <button class="button" onclick="openTeamMenu()">Open Team Menu</button>
  
  <div class="section-title" id="seasonTitle">Season 1 - Roster</div>
  <div id="roster" class="player-grid"></div>
  
  <div class="section-title">Available Recruits</div>
  <p>Recruit up to <strong>5 players</strong>. Fewer = better chances of signing them.</p>
  <div id="recruits" class="player-grid"></div>
  
  <button class="button" id="submitRecruitsButton" onclick="submitRecruits()">Submit Recruits</button>
  <div id="message"></div>

  <div class="season-summary" id="seasonSummary"></div>
  <div class="depth-chart" id="depthChart" style="display: none;"></div>
  <div class="top-25" id="top25Rankings" style="display: none;"></div>

  <button class="button" id="simulateWeek" onclick="playNextWeek()" style="display: none;">Next Week</button>
  <button class="button" id="continue" onclick="openNewSeasonOverlay()" style="display: none;">Continue</button>

</div>


<div id="menuOverlay" onclick="closeTeamMenu()"></div>
<div id="teamMenu">
  <h3>Team Menu</h3>
  <button onclick="showRosterStats()">View Roster Strength</button>
  <button onclick="closeTeamMenu()">Close Menu</button>
</div>
<div id="teamSelectorOverlay" style="display:block; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:2000;"></div>
